[package]
name = "conventional-commit-compiler"
version = "0.1.0"
edition = "2024"
description = "A compiler for Conventional Commits messages: lexer, parser, semantic checks and emitters"
license = "MIT"
keywords = ["conventional-commits", "git", "lint", "parser"]
categories = ["command-line-utilities", "development-tools", "parser-implementations"]

[lib]
name = "ccc"

[[bin]]
name = "ccc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
serde_json = "1"
